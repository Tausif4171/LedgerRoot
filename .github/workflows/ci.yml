name: Quality gates
on: [push, pull_request]
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: ledgerroot
          POSTGRES_PASSWORD: ci-only-password
          POSTGRES_DB: ledgerroot
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U ledgerroot"
          --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      DATABASE_URL: postgresql://ledgerroot:ci-only-password@localhost:5432/ledgerroot
      REDIS_URL: redis://localhost:6379
      S3_ENDPOINT: http://localhost:9000
      S3_ACCESS_KEY: ci-placeholder
      S3_SECRET_KEY: ci-placeholder-only
      BETTER_AUTH_SECRET: ci-placeholder-not-a-production-secret-123456789
      APP_ORIGIN: http://localhost:3100
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run db:generate
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test
      - run: npm run db:test:setup
      - run: npm run test:integration
      - run: npm exec -- playwright install --with-deps chromium
      - run: npm run test:e2e
      - run: npm run build
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: browser-failure-evidence
          path: test-results
